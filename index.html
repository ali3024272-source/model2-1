<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آموزش تعاملی چرخه آب - کلاس سوم</title>
    <style>
        :root {
            --primary-blue: #3498db;
            --water-color: #5dade2;
            --sun-color: #f1c40f;
            --cloud-color: #ecf0f1;
            --grass-color: #27ae60;
            --dark-blue: #2c3e50;
        }

        @font-face {
            font-family: 'Tahoma';
        }

        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #e3f2fd;
            margin: 0;
            padding: 0;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        header {
            background-color: var(--primary-blue);
            color: white;
            padding: 20px;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        /* Water Cycle Animation Area */
        .animation-box {
            position: relative;
            width: 100%;
            height: 400px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 70%, #27ae60 70%, #27ae60 75%, #2980b9 75%);
            border-radius: 20px;
            overflow: hidden;
            border: 5px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .sun {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: var(--sun-color);
            border-radius: 50%;
            box-shadow: 0 0 30px var(--sun-color);
            z-index: 10;
        }

        .cloud {
            position: absolute;
            width: 100px;
            height: 40px;
            background: var(--cloud-color);
            border-radius: 50px;
            top: 60px;
            left: -150px;
            opacity: 0.9;
            transition: all 1s ease;
        }
        .cloud::after, .cloud::before {
            content: '';
            position: absolute;
            background: var(--cloud-color);
            border-radius: 50%;
        }
        .cloud::after { width: 50px; height: 50px; top: -25px; left: 15px; }
        .cloud::before { width: 40px; height: 40px; top: -15px; left: 45px; }

        .vapor {
            position: absolute;
            bottom: 25%;
            width: 2px;
            height: 20px;
            background: rgba(255,255,255,0.6);
            display: none;
        }

        .rain-drop {
            position: absolute;
            width: 2px;
            height: 10px;
            background: var(--primary-blue);
            display: none;
        }

        /* Interactive Buttons */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            font-family: inherit;
            font-weight: bold;
        }

        .btn-step { background-color: white; color: var(--primary-blue); border: 2px solid var(--primary-blue); }
        .btn-step.active { background-color: var(--primary-blue); color: white; }
        .btn-step:hover { transform: scale(1.05); }

        .info-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            min-height: 80px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-right: 5px solid var(--primary-blue);
        }

        /* Quiz Section */
        #quiz-section {
            background: white;
            padding: 30px;
            border-radius: 20px;
            margin-top: 40px;
            display: none;
        }

        .question {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--dark-blue);
        }

        .options {
            display: grid;
            gap: 10px;
        }

        .option-btn {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            text-align: right;
            padding: 15px;
            border-radius: 10px;
        }

        .option-btn:hover { background: #e9ecef; }
        .option-btn.correct { background: #d4edda; border-color: #28a745; }
        .option-btn.wrong { background: #f8d7da; border-color: #dc3545; }

        .star-rating {
            font-size: 40px;
            color: #ddd;
            margin: 15px 0;
        }
        .star-rating .filled { color: var(--sun-color); }

        #reset-btn { background-color: #e67e22; color: white; margin-top: 20px; }

        /* Responsive */
        @media (max-width: 600px) {
            .animation-box { height: 300px; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💧 سفر شگفت‌انگیز آب</h1>
        <p>بیا با هم یاد بگیریم چطور آب از زمین به آسمان می‌رود و برمی‌گردد!</p>
    </header>

    <div class="animation-box" id="scene">
        <div class="sun"></div>
        <div id="cloud1" class="cloud"></div>
        <div id="cloud2" class="cloud" style="top: 100px; left: -200px; transform: scale(0.8);"></div>
        <!-- Sea will be represented by the background CSS -->
    </div>

    <div class="controls">
        <button class="btn-step" onclick="startStep(1)" id="step1">۱. تبخیر</button>
        <button class="btn-step" onclick="startStep(2)" id="step2">۲. تشکیل ابر</button>
        <button class="btn-step" onclick="startStep(3)" id="step3">۳. بارش</button>
        <button onclick="showQuiz()" style="background: #9b59b6; color: white;">📝 شروع آزمون</button>
    </div>

    <div id="info-text" class="info-card">
        روی مرحله اول کلیک کن تا سفر آب شروع بشه!
    </div>

    <div id="quiz-section">
        <div id="quiz-content">
            <div class="question" id="q-text"></div>
            <div class="options" id="q-options"></div>
        </div>
        <div id="result-area" style="display:none;">
            <h2>نتیجه آزمون شما</h2>
            <div id="stars" class="star-rating"></div>
            <p id="score-text"></p>
            <button id="reset-btn" onclick="resetAll()">دوباره شروع کنیم!</button>
        </div>
    </div>
</div>

<script>
    // --- Audio Logic (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(isCorrect) {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (isCorrect) {
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        } else {
            oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        }
        
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.3);
    }

    // --- Animation Logic ---
    const infoText = document.getElementById('info-text');
    const scene = document.getElementById('scene');
    let rainInterval;

    function startStep(step) {
        // Clear previous animations
        stopRain();
        document.querySelectorAll('.vapor').forEach(v => v.remove());
        document.querySelectorAll('.btn-step').forEach(b => b.classList.remove('active'));
        document.getElementById('step' + step).classList.add('active');

        if (step === 1) {
            infoText.innerHTML = "<strong>تبخیر:</strong> خورشید مهربان آب دریاها را گرم می‌کند و آب به شکل بخار به آسمان می‌رود.";
            for(let i=0; i<15; i++) {
                createVapor();
            }
        } else if (step === 2) {
            infoText.innerHTML = "<strong>تشکیل ابر (میعان):</strong> بخار آب در بالای آسمان سرد می‌شود و ذره‌های ریز آب ابرها را می‌سازند.";
            document.getElementById('cloud1').style.left = '100px';
            document.getElementById('cloud2').style.left = '300px';
        } else if (step === 3) {
            infoText.innerHTML = "<strong>بارش:</strong> وقتی ابرها سنگین می‌شوند، آب به شکل باران یا برف دوباره به زمین برمی‌گردد.";
            startRain();
        }
    }

    function createVapor() {
        const v = document.createElement('div');
        v.className = 'vapor';
        v.style.left = Math.random() * 90 + 5 + '%';
        v.style.display = 'block';
        scene.appendChild(v);
        
        let pos = 25;
        const anim = setInterval(() => {
            if (pos > 80) {
                v.remove();
                clearInterval(anim);
            } else {
                pos += 0.5;
                v.style.bottom = pos + '%';
                v.style.opacity = (80 - pos) / 55;
            }
        }, 30);
    }

    function startRain() {
        rainInterval = setInterval(() => {
            const drop = document.createElement('div');
            drop.className = 'rain-drop';
            drop.style.left = Math.random() * 80 + 10 + '%';
            drop.style.top = '100px';
            drop.style.display = 'block';
            scene.appendChild(drop);
            
            let pos = 100;
            const anim = setInterval(() => {
                if (pos > 300) {
                    drop.remove();
                    clearInterval(anim);
                } else {
                    pos += 5;
                    drop.style.top = pos + 'px';
                }
            }, 20);
        }, 100);
    }

    function stopRain() {
        clearInterval(rainInterval);
        document.querySelectorAll('.rain-drop').forEach(d => d.remove());
    }

    // --- Quiz Logic ---
    const questions = [
        { q: "خورشید باعث کدام مرحله از چرخه آب می‌شود؟", options: ["تبخیر", "بارش", "سرد شدن"], correct: 0 },
        { q: "وقتی بخار آب در آسمان سرد می‌شود چه چیزی ساخته می‌شود؟", options: ["خورشید", "ابر", "رودخانه"], correct: 1 },
        { q: "آب به چه شکلی از آسمان به زمین برمی‌گردد؟", options: ["فقط باران", "بخار", "باران، برف یا تگرگ"], correct: 2 },
        { q: "آیا مقدار آب روی زمین همیشه در حال تغییر و جابجایی است؟", options: ["بله", "خیر", "فقط در تابستان"], correct: 0 },
        { q: "کدام کلمه یعنی تبدیل بخار به ابر؟", options: ["تبخیر", "میعان", "ذوب شدن"], correct: 1 }
    ];

    let currentQ = 0;
    let score = 0;

    function showQuiz() {
        document.getElementById('quiz-section').style.display = 'block';
        document.getElementById('quiz-content').style.display = 'block';
        document.getElementById('result-area').style.display = 'none';
        currentQ = 0;
        score = 0;
        loadQuestion();
        window.scrollTo(0, document.body.scrollHeight);
    }

    function loadQuestion() {
        const q = questions[currentQ];
        document.getElementById('q-text').innerText = `سوال ${currentQ + 1}: ${q.q}`;
        const optionsBox = document.getElementById('q-options');
        optionsBox.innerHTML = '';
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsBox.appendChild(btn);
        });
    }

    function checkAnswer(idx, btn) {
        const correctIdx = questions[currentQ].correct;
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        if (idx === correctIdx) {
            btn.classList.add('correct');
            score++;
            playBeep(true);
        } else {
            btn.classList.add('wrong');
            allBtns[correctIdx].classList.add('correct');
            playBeep(false);
        }

        setTimeout(() => {
            currentQ++;
            if (currentQ < questions.length) {
                loadQuestion();
            } else {
                showFinalResult();
            }
        }, 1500);
    }

    function showFinalResult() {
        document.getElementById('quiz-content').style.display = 'none';
        const resultArea = document.getElementById('result-area');
        resultArea.style.display = 'block';
        
        const starsBox = document.getElementById('stars');
        starsBox.innerHTML = '';
        for (let i = 1; i <= 5; i++) {
            const span = document.createElement('span');
            span.innerHTML = '★';
            if (i <= score) span.className = 'filled';
            starsBox.appendChild(span);
        }
        
        document.getElementById('score-text').innerText = `آفرین قهرمان! تو به ${score} سوال از ۵ سوال پاسخ درست دادی.`;
    }

    function resetAll() {
        score = 0;
        currentQ = 0;
        document.getElementById('quiz-section').style.display = 'none';
        document.getElementById('cloud1').style.left = '-150px';
        document.getElementById('cloud2').style.left = '-200px';
        document.querySelectorAll('.btn-step').forEach(b => b.classList.remove('active'));
        infoText.innerHTML = "روی مرحله اول کلیک کن تا سفر آب شروع بشه!";
        stopRain();
        window.scrollTo(0, 0);
    }
</script>

</body>
</html>
